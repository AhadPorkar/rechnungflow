name: Build and verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    name: Linux Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Offline build, unit, HTTP and recovery suites
        run: python scripts/test.py
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-java-${{ matrix.java }}-evidence
          path: build/test-results/
          if-no-files-found: warn
          retention-days: 14
  windows:
    name: Windows Java 21
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: CMD build and tests
        run: scripts\test.cmd
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-java-21-evidence
          path: build/test-results/
          if-no-files-found: warn
          retention-days: 14
  browser:
    name: Native Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python scripts/build.py
      - run: python -m pip install -r tests/browser/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Real browser navigation and CSP checks
        env:
          RF_UI_TRANSPORT: native
        run: python tests/browser/ui_test.py
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-browser-evidence
          path: |
            build/test-results/browser-native.xml
            build/browser/
          if-no-files-found: warn
          retention-days: 14
